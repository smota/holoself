name: Bug report
description: Report a reproducible problem in Holoself
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove personal context, credentials, and private paths before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem, using synthetic data where needed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Holoself version
      placeholder: v0.8.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal context, credentials, private paths, and other sensitive data.
          required: true
