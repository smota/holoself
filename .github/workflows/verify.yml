name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run repository verification
        run: npm run verify

  # Stable required-check name for the "Protect main" ruleset.
  verify:
    name: Verify
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.test.result }}"
            exit 1
          fi
