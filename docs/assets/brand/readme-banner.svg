      <stop offset="1" stop-color="#dceee3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#245f50"/>
      <stop offset="1" stop-color="#10231d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10231d" flood-opacity=".12"/>
    </filter>
  </defs>

