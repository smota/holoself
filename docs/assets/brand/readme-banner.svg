<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Holoself — your context, under your control</title>
  <desc id="desc">A compact Holoself banner showing local context moving through a lens to independent AI projects, with review flowing back.</desc>
  <defs>
