schema: openrig.context-pack/v1
name: agentflow-world
taxonomy: world
description: Canonical L1 AgentFlow SDLC framework law, role ontology, path ownership boundaries, and phase handoff invariants.
atoms:
  - id: operating-model
    address: AGENTS.md#operating-model
    taxonomy: world
    regions:
      - identity
    situations:
      - fresh
      - handover
      - post-compaction
    purpose: depth
    order: 10
    priority: core
    probe:
      prompt: What distinguishes a runtime platform slug from an execution target in AgentFlow?
      expect: Runtime platform names who produced workflow evidence while execution target names how work runs.
      expectedPatterns:
        - runtime platform
        - execution target
  - id: guiding-principles
    address: docs/guiding-principles.md#2-the-six-guiding-principles
    taxonomy: world
    regions:
      - ontology
    situations:
      - fresh
      - handover
    purpose: depth
    order: 20
    priority: core
    probe:
      prompt: How does AgentFlow treat deterministic CLI verification versus unverified agent claims?
      expect: Deterministic validation and evidence gates take precedence over unverified prose claims.
      expectedPatterns:
        - deterministic
        - evidence
  - id: path-ownership-boundaries
    address: AGENTS.md#path-ownership-boundaries
    taxonomy: world
    regions:
      - terrain
    situations:
      - fresh
      - handover
      - post-compaction
    purpose: depth
    order: 30
    priority: core
    probe:
      prompt: Which paths are Builder seats forbidden from modifying and what pin is required before building?
      expect: Builder seats cannot edit tests/oracles/** and require a Phase 3 oracle digest pin.
      expectedPatterns:
        - oracles
        - Phase 3
  - id: two-plane-separation
    address: AGENTS.md#two-plane-separation
    taxonomy: world
    regions:
      - actors
    situations:
      - fresh
      - handover
      - post-compaction
    purpose: depth
    order: 40
    priority: core
    probe:
      prompt: Which plane is authorized to govern goals, unfreeze resolutions, and declare goal completion?
      expect: The external supervisory steering plane (steer.lead) or human operator.
      expectedPatterns:
        - steer.lead
        - supervisory
  - id: workflow-phases
    address: docs/agent-workflow.md#3-workflow-phases
    taxonomy: world
    regions:
      - laws
    situations:
      - fresh
      - handover
      - post-compaction
    purpose: depth
    order: 50
    priority: core
    probe:
      prompt: What is the ordered phase sequence in AgentFlow SDLC?
      expect: Framing, requirements, architecture/design, test/oracle specification, implementation, QA, review, and integration.
      expectedPatterns:
        - phase
        - implementation
  - id: role-pass-contract
    address: docs/agent-workflow.md#4-role-pass-contract
    taxonomy: world
    regions:
      - laws
    situations:
      - fresh
      - handover
    purpose: width
    order: 60
    priority: recommended
    probe:
      prompt: What four provenance fields are required on every completed phase role-pass?
      expect: platform/launcher, executor, transport, and delegationBoundary.
      expectedPatterns:
        - executor
        - transport
        - delegationBoundary
  - id: child-work-history
    address: docs/issue-standards.md#issue-hierarchy
    taxonomy: world
    regions:
      - history
    situations:
      - fresh
      - handover
    purpose: width
    order: 70
    priority: recommended
    probe:
      prompt: How is child slice progress recorded relative to parent goals?
      expect: Durable issue comments, PR bodies, and synchronized goal ledgers track child slice completion.
      expectedPatterns:
        - child
        - issue
  - id: workflow-evidence-state
    address: docs/agent-workflow.md#5-workflow-evidence-and-local-artifacts
    taxonomy: world
    regions:
      - state
    situations:
      - fresh
      - handover
      - post-compaction
    purpose: depth
    order: 80
    priority: core
    probe:
      prompt: Where does durable workflow state live versus scratch execution state?
      expect: Durable state lives in issue comments, PR bodies, commits, and transition envelopes; .agent-runs/ is local scratch.
      expectedPatterns:
        - durable
        - .agent-runs
  - id: execution-targets-affordances
    address: docs/execution-targets.md#core-concepts
    taxonomy: world
    regions:
      - affordances
    situations:
      - fresh
      - handover
    purpose: depth
    order: 90
    priority: core
    probe:
      prompt: How should an agent resolve the execution target before launching delegated work?
      expect: From project configuration or an explicit clarifying question, never by silently inheriting the launcher model.
      expectedPatterns:
        - project config
        - execution target
  - id: execution-distributions-affordances
    address: docs/execution-distributions.md#select-and-inspect
    taxonomy: world
    regions:
      - affordances
    situations:
      - fresh
    purpose: width
    order: 100
    priority: recommended
    probe:
      prompt: Which command inspects the pinned execution distribution before routing work?
      expect: agentflow-sdlc distribution inspect
      expectedPatterns:
        - distribution inspect
